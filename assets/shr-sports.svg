<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Featured project: SHR Sports — Play. Train. Perform. A sports and gym-equipment store built solo as a pnpm and Turborepo monorepo: Next.js storefront and admin, an Express and TypeScript API, and a PostgreSQL database with Prisma.">
