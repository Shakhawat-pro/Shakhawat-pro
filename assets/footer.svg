<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Thanks for stopping by — let's build something good.">
  <title>Thanks for stopping by</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1D3A"/><stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F432" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    
  </defs>
  <style>
  </style>
  
  <rect width="1200" height="150" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="150" rx="22" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="21.5" fill="none" stroke="#1F3B63" stroke-width="1.5"/>
  <circle cx="1100" cy="150" r="220" fill="url(#glow)"/>
  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#EEF3FA">Thanks for stopping by<tspan fill="#C6F432">.</tspan></text>
  <text x="600" y="106" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="17" fill="#8FA3BF">Got an idea, a role or a bug that needs squashing? My inbox is open.</text>
</svg>