<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Hi, I'm Ratul — full-stack developer from Dhaka. Currently building SHR Sports.">
  <title>Hi, I'm Ratul — full-stack developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1D3A"/><stop offset="1" stop-color="#06111F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6F432" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C6F432" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    
  </defs>
  <style>
    .float { animation: float 6s ease-in-out infinite; }
    .f1 { animation-delay: -2s; } .f2 { animation-delay: -4s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .pulse { animation: pulse 2s ease-out infinite; transform-origin: 99px 334px; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.8); opacity: 0; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(-60px, 40px); } }
  </style>
  
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="22" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="21.5" fill="none" stroke="#1F3B63" stroke-width="1.5"/>
  <circle class="drift" cx="1020" cy="80" r="320" fill="url(#glow)"/>

  <text x="72" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="3" fill="#8FA3BF">MD. SHAKHAWAT HOSSAIN  ·  DHAKA, BD</text>
  <text x="68" y="190" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#EEF3FA" letter-spacing="-2">Hi, I'm Ratul<tspan fill="#C6F432">.</tspan></text>
  <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="23" fill="#8FA3BF">
    <tspan x="72" y="242">Full-stack developer. I build products end to end —</tspan>
    <tspan x="72" y="274">from the database schema to the pixels people touch.</tspan>
  </text>

  <g>
    <rect x="72" y="312" width="330" height="44" rx="22" fill="#0F2444" stroke="#1F3B63" stroke-width="1.5"/>
    <circle class="pulse" cx="99" cy="334" r="6" fill="#C6F432"/>
    <circle cx="99" cy="334" r="6" fill="#C6F432"/>
    <text x="118" y="340" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="16" fill="#EEF3FA">Currently building <tspan font-weight="700" fill="#C6F432">SHR Sports</tspan></text>
  </g>

  <line class="flow" x1="762" y1="126" x2="762" y2="314" stroke="#C6F432" stroke-width="2" stroke-linecap="round"/>
  <circle cx="762" cy="126" r="5" fill="#0B1D3A" stroke="#C6F432" stroke-width="2"/><circle cx="762" cy="220" r="5" fill="#0B1D3A" stroke="#C6F432" stroke-width="2"/><circle cx="762" cy="314" r="5" fill="#0B1D3A" stroke="#C6F432" stroke-width="2"/>
  
    <g class="float f0">
      <rect x="790" y="92" width="330" height="68" rx="14" fill="#0F2444" stroke="#1F3B63" stroke-width="1.5"/>
      <rect x="808" y="114" width="24" height="24" rx="7" fill="#C6F432" fill-opacity="0.95"/>
      <text x="848" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2" fill="#C6F432">INTERFACE</text>
      <text x="848" y="143" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="17" fill="#EEF3FA">Next.js · React · GSAP</text>
    </g>
    <g class="float f1">
      <rect x="790" y="186" width="330" height="68" rx="14" fill="#0F2444" stroke="#1F3B63" stroke-width="1.5"/>
      <rect x="808" y="208" width="24" height="24" rx="7" fill="#C6F432" fill-opacity="0.70"/>
      <text x="848" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2" fill="#C6F432">API</text>
      <text x="848" y="237" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="17" fill="#EEF3FA">Express · Laravel · REST</text>
    </g>
    <g class="float f2">
      <rect x="790" y="280" width="330" height="68" rx="14" fill="#0F2444" stroke="#1F3B63" stroke-width="1.5"/>
      <rect x="808" y="302" width="24" height="24" rx="7" fill="#C6F432" fill-opacity="0.45"/>
      <text x="848" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="2" fill="#C6F432">DATA</text>
      <text x="848" y="331" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif" font-size="17" fill="#EEF3FA">Prisma · PostgreSQL · MySQL</text>
    </g>
</svg>